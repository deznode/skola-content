- question:
    kea: "Kual é diferensa entri abri un fixeru ku modu `\"w\"` i ku modu `\"a\"`?"
  options:
    - text: { kea: "`\"w\"` ta **apaga** tudu konteúdu ki tinha i kumesa di novu; `\"a\"` ta **adisiona** na fin sen apaga nada" }
      correct: true
    - text: { kea: "`\"w\"` ta adisiona; `\"a\"` ta apaga" }
      correct: false
    - text: { kea: "Es é igual — dos ta skrebe" }
      correct: false
    - text: { kea: "`\"w\"` é pa lé; `\"a\"` é pa skrebe" }
      correct: false
- question:
    kea: "Pamodi é midjór uza `with open(...) as f:` en bez di `f = open(...)`?"
  options:
    - text: { kea: "`with` ta **fexa** fixeru automátikamenti kuandu bloku akaba — mesmu si un eru akontese" }
      correct: true
    - text: { kea: "`with` é más rápidu pa lé fixeru grandi" }
      correct: false
    - text: { kea: "`with` ta kria fixeru si el ka izisti" }
      correct: false
    - text: { kea: "Ka ten diferensa — es é só stilu" }
      correct: false
- question:
    kea: "Bu tenta abri un fixeru ku modu `\"r\"` ma fixeru ka izisti. Kuze ki ta kontise?"
  options:
    - text: { kea: "Un `FileNotFoundError` — pa lé, fixeru ten ki izisti (verifika ku `os.path.exists()` antis)" }
      correct: true
    - text: { kea: "Python ta kria un fixeru vaziu automátikamenti" }
      correct: false
    - text: { kea: "Ta retorna un string vaziu sen eru" }
      correct: false
    - text: { kea: "Ta abri fixeru na modu `\"w\"` en bez" }
      correct: false
